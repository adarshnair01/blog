# Affiliate recommendations shown on the blog (Toolkit page, end of posts, sidebar, home page).
#
# HOW TO EARN FROM THESE
#  - Amazon items: set your Associates tag once in site/src/site.ts (affiliates.amazonTag).
#    It is appended to every `amazon:` link automatically.
#  - Everything else: replace `url` with your personal affiliate/referral link from that
#    program (Coursera, DataCamp, etc.). Until you do, the link still works, it just earns nothing.
#
# FIELDS
#  id        unique, used in analytics events (affiliate_click → item_id)
#  name      product name
#  category  books | courses | tools  (add more freely; they become filter chips)
#  blurb     one line: what it is
#  why       one line: why YOU recommend it (this is what converts — make it personal)
#  amazon    search text or ASIN → builds an Amazon link with your tag   (use this OR url)
#  url       direct (affiliate) link
#  cta       button text (default "Check it out")
#  badge     optional ribbon, e.g. "My #1 pick"
#  topics    post tags this is relevant to (matched case-insensitively against post tags)
#  featured  true → shown on the home page and as fallback when no topic matches
#  affiliate false → a plain recommendation that earns nothing: the link is not marked
#            "sponsored" and the card shows a "Not sponsored" label. Default: true.

- id: hands-on-ml
  name: Hands-On Machine Learning with Scikit-Learn, Keras & TensorFlow
  category: books
  blurb: Aurélien Géron's practical tour from linear models to deep learning.
  why: The book I recommend most to people starting out — every chapter ends in runnable code.
  amazon: Hands-On Machine Learning with Scikit-Learn Keras TensorFlow Geron
  cta: View on Amazon
  badge: My #1 pick
  featured: true
  topics: [machine learning, scikit-learn, deep learning, neural networks, python, data science, supervised learning, regression, classification]

- id: designing-ml-systems
  name: Designing Machine Learning Systems
  category: books
  blurb: Chip Huyen on taking models from notebook to production.
  why: The best single read on MLOps, data drift and monitoring that I know of.
  amazon: Designing Machine Learning Systems Chip Huyen
  cta: View on Amazon
  featured: true
  topics: [mlops, production, deployment, machine learning engineering, model monitoring, data engineering, system design]

